# SMTP邮件服务配置
smtp:
  host: "smtp.example.com"  # SMTP服务器地址
  NoTLSport: 25             # 端口号，默认25
  TLSport1: 587             # 端口号，默认587
  TLSport2: 465             # 端口号，默认465
  user: "your_username"     # 用户名
  password: "your_password" # 密码
  secure: false             # 是否使用TLS
  tls:
    rejectUnauthorized: false # 是否验证证书